name: Update events

# Runs the openlitfass image against this instance repository:
#   fetch       -> data/events.json, data/categories.json, status fields in
#                  sources/*.json, removes past inbox/ files
#   build-site  -> public/ (complete static site; not committed, see below)
# and commits the changed data back into the repository.
on:
  schedule:
    # Every 6 hours. Forgejo cron uses standard 5-field syntax.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'instance.json'
      - 'categories.json'
      - 'sources/**'
      - 'inbox/**'
      - 'site/**'
      - '.forgejo/workflows/update-events.yml'

permissions:
  contents: write

jobs:
  update:
    # ADJUST to your runner label (Settings > Actions > Runners).
    runs-on: docker
    container:
      # ADJUST: openLitfass image from GitHub (core repo .github/workflows/image.yml).
      # Hosting of this instance repo is still open: this file targets a
      # Forgejo runner; on GitHub use openlitfass/example-instance/.github/
      # workflows/update-events.yml instead.
      # Pin a commit tag instead of :latest for reproducible runs.
      image: ghcr.io/OWNER/openlitfass:latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Fetch events
        run: fetch .

      # Verifies the site still builds with the new data. Publishing
      # public/ (Codeberg Pages, rsync to a web server, ...) is added here
      # once hosting is decided.
      - name: Build site
        run: build-site -out public .

      - name: Commit and push if changed
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "weissens-bot"
          git config user.email "bot@weissens.ee"
          git add -A data sources inbox
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: update events data [skip ci]"
            git push
          fi
